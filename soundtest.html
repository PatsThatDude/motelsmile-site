L("Browser: "+navigator.userAgent); L("AudioContext: "+(window.AudioContext?"yes":window.webkitAudioContext?"webkit only":"NO")); L("audioSession: "+(navigator.audioSession?navigator.audioSession.type:"n/a"));
addEventListener("error",e=>L("ERROR: "+e.message));
const C=window.AudioContext||window.webkitAudioContext;

document.getElementById("b1").onclick=()=>{ try{ const c=new C(); const p=c.resume&&c.resume(); p&&p.catch&&p.catch(e=>L("resume rejected: "+e.message)); beep(c,"Test 1"); }catch(e){L("Test 1 FAILED: "+e.message)} };
