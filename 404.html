<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>No Vacancy · Motel Smile</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0b12">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#0a0b12;--fg:#efe9f6;--dim:#9b93ab;--pink:#ff3fd0;--red:#ff3d5a;--cyan:#4fe3ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#1c1030 0%,var(--bg) 60%) var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
main{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:520px}
img{width:96px;height:96px}
.sign{font-family:Yellowtail,cursive;font-size:clamp(56px,16vw,104px);line-height:1;color:var(--red);
  text-shadow:0 0 6px var(--red),0 0 22px var(--red),0 0 48px rgba(255,61,90,.5)}
.sign .no{color:var(--pink);text-shadow:0 0 6px var(--pink),0 0 22px var(--pink);animation:buzz 4s infinite}
@keyframes buzz{0%,7%,9%,52%,54%,100%{opacity:1}8%,53%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.sign .no{animation:none}}
p{margin:0;color:var(--dim);font-size:17px;line-height:1.5}
code{color:var(--cyan)}
a.btn{margin-top:6px;display:inline-block;padding:12px 22px;border-radius:999px;border:2px solid var(--cyan);color:var(--cyan);text-decoration:none;font-weight:700;
  box-shadow:0 0 14px rgba(79,227,255,.35),inset 0 0 10px rgba(79,227,255,.2)}
a.btn:hover,a.btn:focus-visible{background:rgba(79,227,255,.12);outline:none}
</style>
</head>
<body>
<main>
  <img src="/img/smile-logo-96.webp" alt="">
  <div class="sign"><span class="no">No</span> Vacancy</div>
  <p>That room doesn't exist. Somebody probably ripped the number off the door.</p>
  <a class="btn" href="/">Back to the roof</a>
</main>
</body>
</html>
